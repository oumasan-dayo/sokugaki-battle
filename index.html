</style></head><body><div id="app"><div class="screen">

</section></div></div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>

let W=0,H=0,dpr=1,phase='title',mode='com',streak=0,name='';let strokes=[],cur=null,drawing=false,drawArea=null;let engine,runner,player,enemy,pSword,eSword,pJoint,eJoint,stageBodies=[],currentStage;let pSwordPts=[],eSwordPts=[];let pDamage=0,eDamage=0,battleStart=0,approachStart=0,animStart=0,playerSwing=0,enemySwing=0,lastPlayerHit=0,lastEnemyHit=0,lastPJump=-999,lastEJump=-999,nextEnemyJump=0;let countdownTimer,drawTimer;const DRAW_TIME=10,BATTLE_TIME=30,MAXLEN=86,APPROACH=2.1;
const STAGES=[
{name:'平原〜PLAIN〜',kind:'plain',bg:0,build:()=>[Bodies.rectangle(W/2,H-30,W,60,{isStatic:true,friction:.9})]},
{name:'中央台〜CENTER〜',kind:'center',bg:1,build:()=>[Bodies.rectangle(W/2,H-30,W,60,{isStatic:true}),Bodies.rectangle(W/2,H-105,92,18,{isStatic:true,friction:.9})]},
{name:'二段〜TWIN〜',kind:'twin',bg:2,build:()=>[Bodies.rectangle(W/2,H-30,W,60,{isStatic:true}),Bodies.rectangle(W*.28,H-90,82,18,{isStatic:true}),Bodies.rectangle(W*.72,H-125,82,18,{isStatic:true})]},
{name:'丘道〜HILLS〜',kind:'hills',bg:3,build:()=>[Bodies.rectangle(W/2,H-30,W,60,{isStatic:true}),Bodies.rectangle(W*.27,H-70,65,16,{isStatic:true}),Bodies.rectangle(W*.39,H-88,65,16,{isStatic:true}),Bodies.rectangle(W*.73,H-88,65,16,{isStatic:true}),Bodies.rectangle(W*.61,H-70,65,16,{isStatic:true})]},

];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);
function area(){let s=Math.min(360,Math.max(280,W-28));return{x:(W-s)/2,y:90,w:s,h:s}}

function line(s){if(!s||s.points.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10151d';ctx.lineWidth=s.width;ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);ctx.stroke();ctx.restore()}
function drawAll(){ctx.clearRect(0,0,W,H);if(phase==='draw')drawPad();for(const s of strokes)line(s);if(cur)line(cur)}

function startGame(selected){mode=selected;name=nameInput.value.trim().slice(0,8);title.style.display='none';game.style.display='block';message.style.display='none';resize();phase='count';drawUI.style.display='none';jumpBtn.style.display='none';centerFX.style.display='none';let n=3;timer.textContent=n;clearInterval(countdownTimer);countdownTimer=setInterval(()=>{n--;timer.textContent=n;if(n<=0){clearInterval(countdownTimer);beginDraw()}},700)}
function beginDraw(){phase='draw';drawUI.style.display='block';jumpBtn.style.display='none';drawArea=area();strokes=[];cur=null;drawAll();let t=DRAW_TIME;timer.textContent=t;clearInterval(drawTimer);drawTimer=setInterval(()=>{t--;timer.textContent=t;if(t<=0){clearInterval(drawTimer);finishDraw()}},1000)}
function swordData(){let pts=[];for(const s of strokes)for(const p of s.points)pts.push(p);if(pts.length<2){let y=drawArea.y+drawArea.h/2;pts=[{x:W/2,y},{x:W/2+58,y}]}
// Anchor is the central brown handle: translate so its center is the sword grip.
let ax=W/2,ay=drawArea.y+drawArea.h*.72;let rel=pts.map(p=>({x:p.x-ax,y:p.y-ay}));let max=Math.max(...rel.map(p=>Math.hypot(p.x,p.y)),1);let scale=Math.min(1,MAXLEN/max);rel=rel.map(p=>({x:p.x*scale,y:p.y*scale}));let span=Math.max(...rel.map(p=>p.x))-Math.min(...rel.map(p=>p.x));if(span<28)rel=[{x:4,y:0},{x:70,y:0}];return{points:rel,thick:Math.max(4,Math.min(12,strokes.length?Math.max(...strokes.map(s=>s.width)):8))}}
function finishDraw(){phase='intro';drawUI.style.display='none';let d=swordData();pSwordPts=d.points;eSwordPts=[{x:6,y:0},{x:68,y:0}];startBattle(d)}
function startBattle(d){engine=Engine.create();engine.gravity.y=.82;engine.positionIterations=8;engine.velocityIterations=8;currentStage=mode==='streak'&&streak>0?STAGES[Math.floor(Math.random()*STAGES.length)]:STAGES[0];if(mode==='com')currentStage=STAGES[Math.floor(Math.random()*STAGES.length)];stageBodies=currentStage.build();stageEl.textContent=currentStage.name;const groundTop=H-60,fy=groundTop-44;player=Bodies.rectangle(W*.19,fy,28,50,{friction:.9,restitution:.05,density:.002});enemy=Bodies.rectangle(W*.81,fy,28,50,{friction:.9,restitution:.05,density:.002});pSword=Bodies.rectangle(player.position.x+38,fy-14,MAXLEN,7,{friction:.4,restitution:.15,density:.001});eSword=Bodies.rectangle(enemy.position.x-38,fy-14,MAXLEN,7,{friction:.4,restitution:.15,density:.001});pJoint=Constraint.create({bodyA:player,pointA:{x:0,y:-17},bodyB:pSword,pointB:{x:-38,y:0},stiffness:.98,damping:.25});eJoint=Constraint.create({bodyA:enemy,pointA:{x:0,y:-17},bodyB:eSword,pointB:{x:38,y:0},stiffness:.98,damping:.25});const walls=[Bodies.rectangle(-20,H/2,40,H,{isStatic:true}),Bodies.rectangle(W+20,H/2,40,H,{isStatic:true})];Composite.add(engine.world,[...stageBodies,...walls,player,enemy,pSword,eSword,pJoint,eJoint]);pDamage=eDamage=0;lastPlayerHit=lastEnemyHit=0;lastPJump=-999;lastEJump=-999;nextEnemyJump=performance.now()+5000+Math.random()*5000;approachStart=performance.now();battleStart=0;battleReady=false;runner=Runner.create();Runner.run(runner,engine);Events.on(engine,'collisionStart',onCollision);showIntro();requestAnimationFrame(loop)}
function showIntro(){centerFX.style.display='flex';let seq=['BATTLE','↓','START'];let i=0;function next(){if(i>=seq.length){centerFX.style.display='none';phase='battle';battleReady=false;approachStart=performance.now();battleStart=0;return}lyric.textContent=seq[i++];lyric.classList.remove('show');void lyric.offsetWidth;lyric.classList.add('show');setTimeout(next,650)}next()}
function onCollision(ev){for(const pair of ev.pairs){let a=pair.bodyA,b=pair.bodyB;let now=performance.now();if((a===pSword&&b===enemy)||(b===pSword&&a===enemy)){if(now-lastPlayerHit>320){let sp=Vector.magnitude(pSword.velocity);let dmg=Math.min(24,Math.max(3,sp*2.6));eDamage=Math.min(100,eDamage+dmg);hitFX(enemy.position.x,enemy.position.y);lastPlayerHit=now;showDamage(enemy.position.x,enemy.position.y,dmg)}}if((a===eSword&&b===player)||(b===eSword&&a===player)){if(now-lastEnemyHit>320){let sp=Vector.magnitude(eSword.velocity);let dmg=Math.min(24,Math.max(3,sp*2.6));pDamage=Math.min(100,pDamage+dmg);hitFX(player.position.x,player.position.y);lastEnemyHit=now;showDamage(player.position.x,player.position.y,dmg)}}}}
let texts=[];function showDamage(x,y,d){texts.push({x,y,d:Math.floor(d),t:performance.now()})}function hitFX(x,y){flash.style.opacity='.72';setTimeout(()=>flash.style.opacity='0',70);for(let i=0;i<8;i++){let ang=Math.random()*Math.PI*2;texts.push({x:x+Math.cos(ang)*4,y:y+Math.sin(ang)*4,d:'✦',t:performance.now(),spark:true})}}

let sec=(now-battleStart)/1000;const dist=Math.abs(enemy.position.x-player.position.x);const range=105;
// Independent legs movement + torso movement. Walk only with legs; sword hand stays still until in range.

if(!inRange){Body.applyForce(player,player.position,{x:pd*.00048,y:0});Body.applyForce(enemy,enemy.position,{x:ed*.00048,y:0});playerSwing*=.78;enemySwing*=.78}else{playerSwing+=.24;enemySwing+=.21}

orientBoth();render();timer.textContent=Math.max(0,Math.ceil(BATTLE_TIME-sec))+'s';if(pDamage>=100||eDamage>=100||sec>=BATTLE_TIME){endBattle();return}requestAnimationFrame(loop)}
function orientBoth(){if(!player||!enemy)return;let dirP=enemy.position.x>player.position.x?1:-1,dirE=player.position.x>enemy.position.x?1:-1;Body.setAngle(player,0);Body.setAngle(enemy,0);let baseY=-17;let pAng=dirP>0?0:Math.PI,eAng=dirE>0?0:Math.PI;let pSwing=(Math.abs(enemy.position.x-player.position.x)<105)?Math.sin(playerSwing)*1.15:0;let eSwing=(Math.abs(enemy.position.x-player.position.x)<105)?Math.sin(enemySwing)*1.15:0;Body.setAngle(pSword,pAng+pSwing);Body.setAngle(eSword,eAng-eSwing);}
function render(){ctx.clearRect(0,0,W,H);drawBackground();drawStage();drawFighter(player,enemy,'you');drawFighter(enemy,player,'com');drawSword(pSword,pSwordPts,true);drawSword(eSword,eSwordPts,false);drawTexts();document.getElementById('hpYou').textContent=Math.max(0,Math.floor(100-pDamage))+'%';document.getElementById('hpCom').textContent=Math.max(0,Math.floor(100-eDamage))+'%'}

function limb(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function drawFighter(body,other,side){if(!body)return;let x=body.position.x,y=body.position.y,dir=other.position.x>x?1:-1;let walk=side==='you'?Math.sin(performance.now()/95):Math.sin(performance.now()/100+1.5);ctx.save();ctx.translate(x,y);ctx.strokeStyle='#fff';ctx.lineWidth=4.5;ctx.lineCap='round';let head={x:0,y:-39},neck={x:0,y:-27},hip={x:0,y:4};ctx.beginPath();ctx.arc(head.x,head.y,9,0,Math.PI*2);ctx.stroke();limb(neck,hip);

let knee1={x:dir*(9+walk*5),y:17},foot1={x:dir*(14+walk*7),y:36};let knee2={x:dir*(-9-walk*5),y:17},foot2={x:dir*(-14-walk*7),y:36};limb(hip,knee1);limb(knee1,foot1);limb(hip,knee2);limb(knee2,foot2);ctx.restore();if(name&&side==='you'){ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#75b8ff';ctx.fillText(name,x,y-58)}else{ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillStyle='#ff8b9f';ctx.fillText('COM',x,y-58)}}
function drawSword(body,pts,isPlayer){if(!body)return;ctx.save();ctx.translate(body.position.x,body.position.y);ctx.rotate(body.angle);ctx.strokeStyle=isPlayer?'#e7f0ff':'#ffccd4';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';let arr=pts.length>1?pts:[{x:0,y:0},{x:MAXLEN,y:0}];ctx.beginPath();ctx.moveTo(arr[0].x,arr[0].y);for(let i=1;i<arr.length;i++)ctx.lineTo(arr[i].x,arr[i].y);ctx.stroke();ctx.strokeStyle='#9b6b47';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-38,0);ctx.lineTo(-16,0);ctx.stroke();ctx.strokeStyle='#d6b38d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-41,-5);ctx.lineTo(-41,5);ctx.stroke();ctx.restore()}
function drawTexts(){let now=performance.now();texts=texts.filter(t=>now-t.t<500);ctx.textAlign='center';for(const t of texts){let age=(now-t.t)/500;ctx.globalAlpha=1-age;ctx.fillStyle=t.spark?'#fff':'#ffd65a';ctx.font=t.spark?'bold 18px sans-serif':'900 13px sans-serif';ctx.fillText(t.spark?t.d:'-'+t.d+'%',t.x,t.y-20-age*25)}ctx.globalAlpha=1}
function endBattle(){phase='result';if(runner)Runner.stop(runner);let win;if(eDamage>=100)win=true;else if(pDamage>=100)win=false;else if(eDamage>pDamage)win=true;else if(pDamage>eDamage)win=false;else win=null;if(mode==='streak'){if(win===true)streak++;else streak=0}else streak=0;result.textContent=win===true?'YOU WIN!':win===false?'YOU LOSE...':'DRAW';resultLine.textContent=win===true?'勝利':win===false?'敗北':'引き分け';damageLine.textContent=`与えた ${Math.floor(eDamage)}% / 受けた ${Math.floor(pDamage)}%`;streakOut.textContent=mode==='streak'?(win===true?`${streak}連勝！`:`最終結果：${streak}連勝`):'';message.style.display='flex'}
comBtn.onclick=()=>startGame('com');streakBtn.onclick=()=>startGame('streak');again.onclick=()=>{message.style.display='none';startGame(mode)};resize();
